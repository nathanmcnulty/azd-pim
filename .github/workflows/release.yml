name: Release azd-pim

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to create, including the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-azd-pim
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require protected main
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Release workflow dispatches must select the protected main branch.'
          }
          if ($env:RELEASE_VERSION -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*))(?:\.(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*)))*)?$') {
            throw 'Release versions must use vMAJOR.MINOR.PATCH with an optional prerelease suffix.'
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install PowerShell test dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Install-Module Microsoft.Graph.Authentication -RequiredVersion 2.38.0 -Force -Scope CurrentUser

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/pim-notification-poller/package-lock.json

      - name: Install polling Function dependencies
        working-directory: src/pim-notification-poller
        run: npm ci --ignore-scripts

      - name: Install Bicep
        run: az bicep install --version v0.46.1

      - name: Validate release commit
        run: ./scripts/Test-Repository.ps1

      - name: Build deterministic archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/New-ReleaseArtifacts.ps1 -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: src/pim-notification-poller
          format: spdx-json
          output-file: dist/azd-pim.spdx.json
          syft-version: v1.51.1
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize release metadata and checksums
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = [ordered]@{
            version = $env:RELEASE_VERSION
            commit = $env:GITHUB_SHA
            sourceRef = $env:GITHUB_REF
          } | ConvertTo-Json
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/release-metadata.json'),
            ($metadata + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          $files = Get-ChildItem -LiteralPath ./dist -File |
            Where-Object Name -NE 'SHA256SUMS' |
            Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'dist/SHA256SUMS'),
            (($lines -join "`n") + "`n"),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload validated release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require protected main
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/main') {
            throw 'Release publication requires the protected main branch.'
          }
          if ($env:RELEASE_VERSION -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*))(?:\.(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*)))*)?$') {
            throw 'Release versions must use vMAJOR.MINOR.PATCH with an optional prerelease suffix.'
          }

      - name: Download validated release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: dist

      - name: Verify candidate identity and checksums
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content -LiteralPath ./dist/release-metadata.json -Raw | ConvertFrom-Json
          if ($metadata.version -cne $env:RELEASE_VERSION -or
              $metadata.commit -cne $env:GITHUB_SHA -or
              $metadata.sourceRef -cne 'refs/heads/main') {
            throw 'Release candidate metadata does not match this protected workflow run.'
          }
          $checksumLines = @(Get-Content -LiteralPath ./dist/SHA256SUMS)
          if ($checksumLines.Count -eq 0) { throw 'SHA256SUMS is empty.' }
          $checksummedNames = @()
          foreach ($line in $checksumLines) {
            if ($line -notmatch '^(?<hash>[0-9a-f]{64})  (?<name>[^/\\]+)$') {
              throw "Invalid SHA256SUMS entry: $line"
            }
            $checksummedNames += $Matches.name
            $artifactPath = Join-Path ./dist $Matches.name
            if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
              throw "Checksummed artifact is missing: $($Matches.name)"
            }
            $actualHash = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -cne $Matches.hash) {
              throw "Checksum mismatch: $($Matches.name)"
            }
          }
          $unsignedFiles = @(Get-ChildItem -LiteralPath ./dist -File |
            Where-Object Name -NE 'SHA256SUMS' |
            Where-Object Name -NotIn $checksummedNames)
          if ($unsignedFiles.Count -gt 0) {
            throw "Files missing from SHA256SUMS: $($unsignedFiles.Name -join ', ')"
          }

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.1.0
        with:
          subject-path: dist/*

      - name: Create verified tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = $env:GITHUB_REPOSITORY
          $version = $env:RELEASE_VERSION
          $commit = $env:GITHUB_SHA

          $existingRefJson = & gh api "repos/$repository/git/ref/tags/$version" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tagRef = $existingRefJson | ConvertFrom-Json
            if ($tagRef.object.type -cne 'tag') {
              throw 'An existing release tag must be an annotated tag.'
            }
            $tagObject = gh api "repos/$repository/git/tags/$($tagRef.object.sha)" | ConvertFrom-Json
          }
          else {
            $tagObject = gh api --method POST "repos/$repository/git/tags" `
              -f "tag=$version" `
              -f "message=azd-pim $version" `
              -f "object=$commit" `
              -f 'type=commit' | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the annotated tag object.' }
            $tagRef = gh api --method POST "repos/$repository/git/refs" `
              -f "ref=refs/tags/$version" `
              -f "sha=$($tagObject.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the release tag reference.' }
          }

          if ($tagObject.tag -cne $version -or
              $tagObject.object.type -cne 'commit' -or
              $tagObject.object.sha -cne $commit -or
              $tagRef.object.sha -cne $tagObject.sha) {
            throw 'The annotated release tag does not resolve to the validated commit.'
          }

          $remoteLines = @(git ls-remote --tags "https://github.com/$repository.git" `
            "refs/tags/$version" "refs/tags/$version^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify the remote release tag.' }
          $remoteRefs = @{}
          foreach ($line in $remoteLines) {
            $parts = $line -split "`t", 2
            if ($parts.Count -eq 2) { $remoteRefs[$parts[1]] = $parts[0] }
          }
          if ($remoteRefs["refs/tags/$version"] -cne $tagObject.sha -or
              $remoteRefs["refs/tags/$version^{}"] -cne $commit) {
            throw 'The remote release tag does not peel to the validated commit.'
          }

          $arguments = @(
            'release', 'create', $version, './dist/*',
            '--repo', $repository,
            '--verify-tag',
            '--generate-notes',
            '--title', "azd-pim $version"
          )
          if ($version.Contains('-')) {
            $arguments += @('--prerelease', '--latest=false')
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
